<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!-- ИСПРАВЛЕНО: Убрана точка в пути к фавикону -->
		<link rel="shortcut icon" href="/el-trade-logo.png" type="image/png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#000000" />

		<!-- ОПТИМИЗИРОВАНО: Описание сделано более привлекательным и содержит бренд -->
		<meta
			name="description"
			content="Обучение трейдингу онлайн и офлайн от экспертов академии El-Trade. Получите проверенные торговые стратегии и начните стабильно зарабатывать."
		/>

		<!-- ИСПРАВЛЕНО: Код верификации Google Search Console -->
		<meta
			name="google-site-verification"
			content="eI4fgZK_qtxwuNTQgbjnEzsgXK_b8c_WdbsZfAz2W2k"
		/>

		<!-- ИСПРАВЛЕНО: Перенос строки в Open Graph заголовке убран, чтобы текст не ломался в соцсетях -->
		<meta
			property="og:title"
			content="El-Trade — Профессиональная академия трейдинга"
		/>
		<meta
			property="og:description"
			content="Получите навыки трейдинга и научитесь стабильно зарабатывать, используя проверенные стратегии."
		/>
		<!-- ИСПРАВЛЕНО: Путь к картинке команды переведен на нижний регистр (.png вместо .PNG), чтобы избежать ошибок на Linux-серверах -->
		<meta
			property="og:image"
			content="https://www.eltradeacademy.com/team/oyatillo.png"
		/>

		<!-- ИСПРАВЛЕНО: Стандартные иконки React заменены на ваш логотип -->
		<link rel="apple-touch-icon" href="/el-trade-logo.png" />
		<link rel="manifest" href="/manifest.json" />

		<!-- ИСПРАВЛЕНО: Каноническая ссылка, защищающая от дублей страниц -->
		<link rel="canonical" href="https://www.eltradeacademy.com/" />

		<title>El-Trade — Профессиональная академия трейдинга</title>
	</head>

	<body>
		<noscript>You need to enable JavaScript to run this app.</noscript>
		<div id="root"></div>
	</body>
</html>
